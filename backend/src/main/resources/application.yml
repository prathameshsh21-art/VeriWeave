server:
  port: 8080

spring:
  application:
    name: veriweave-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:mysql://localhost:3306/veriweave_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}}
    username: ${SPRING_DATASOURCE_USERNAME:veriweave_user}
    password: ${SPRING_DATASOURCE_PASSWORD:VeriWeaveLocal2026}
    driver-class-name: com.mysql.cj.jdbc.Driver
    
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_AUTH:true}
          starttls:
            enable: ${SPRING_MAIL_STARTTLS_ENABLE:true}
            required: ${SPRING_MAIL_STARTTLS_REQUIRED:true}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# VeriWeave Security, CORS & Mail Configuration
veriweave:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://veriweave-frontend.onrender.com,https://veriweave.xyz,https://www.veriweave.xyz}
  jwt:
    # Requires 256-bit secret via VERIWEAVE_JWT_SECRET (or JWT_SECRET). No hardcoded fallback.
    secret: ${VERIWEAVE_JWT_SECRET:${JWT_SECRET:}}
    expiration-ms: 86400000 # 24 hours
    refresh-expiration-ms: 604800000 # 7 days
  frontend:
    url: ${VERIWEAVE_FRONTEND_URL:${VERIWEAVE_FRONTEND_BASE_URL:${FRONTEND_URL:https://veriweave-frontend.onrender.com}}}
  mail:
    from: ${VERIWEAVE_MAIL_FROM:no-reply@veriweave.com}
