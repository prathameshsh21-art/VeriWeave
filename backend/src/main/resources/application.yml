server:
  port: 8080

spring:
  application:
    name: veriweave-backend
  datasource:
    url: jdbc:mysql://localhost:3306/veriweave_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: veriweave_user
    password: VeriWeaveLocal2026
    driver-class-name: com.mysql.cj.jdbc.Driver
    
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# VeriWeave Security Configuration
veriweave:
  jwt:
    # 256-bit default secret key for development. Override with JWT_SECRET in production.
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000 # 24 hours
    refresh-expiration-ms: 604800000 # 7 days
